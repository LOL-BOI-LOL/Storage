<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Chat Room</title>
    <style>
      body {
        margin: 0px;
        overflow-x: hidden;
      }
      #top {
        background-color: rgb(19, 21, 32);
        color: rgb(216, 220, 246);
      }
      .top {
        display: inline-block;
        font-size: 20px;
      }
      #login {
        cursor: pointer;
        margin-right: 30px;
      }
      #roomList {
        position: absolute;
        margin-top: 1px;
        margin-left: -13px;
      }
      .room {
        display: none;
        z-index: 1;
        margin: 0px;
        padding: 12px 16px;
        min-width: 20px;
        background-color: rgb(19, 21, 32);
        box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
        cursor: pointer;
      }
      #rooms:hover .room {
        display: block;
      }
      .room:hover {
        background-color: rgb(31, 34, 47);
      }
      #currentRoom {
        width: 100%;
        text-align: center;
      }
      #messageSpace {
        overflow: auto;
        height: 400px;
        width: 75%;
        margin: 20px 12.5% 0px 12.5%;
        border: 3px solid black;
        border-radius: 6px;
      }
      .message {
        width: 500px;
        overflow: auto;
        display: block;
        border: 2px solid black;
        margin: 5px;
      }
      .messagePart {
        margin-left: 10px;
      }
      .stamp {
        font-size: 11px;
        font-family: monospace;
      }
      input {
        width: 50vw;
        margin: 2vh 25vw;
      }
      .submitInput {
        width: 10vw;
        margin: 0vh 45vw;
      }
      label {
        display: block;
        margin-top: 25px;
        width: 100%;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <script src = "/socket.io/socket.io.js"></script>
    <div id = 'top'>
      <p class = 'top' style = 'font-size: 20px; margin: 25px 50px 30px 30px;'>
        undefined 
        <span style = 'font-size: 40px; font-size: 40px;'>
          Chat Rooms
        </span>
      </p>
      <p id = 'login' class = 'top'>
        Login
      </p>
      <div id = 'rooms' style = 'display:inline-block;'>
        <p class = 'top'>
          Rooms
        </p>
        <div id = 'roomList'>
          <p id = 'room1' class = 'room'>Room 1</p>
          <p id = 'room2' class = 'room'>Room 2</p>
          <p id = 'room3' class = 'room'>Room 3</p>
        </div>
      </div>
    </div>
    <h1 id = 'currentRoom'>
      Chat Room 1
    </h1>
    <div id = 'messageSpace'></div>
    <form id = 'form' action = ''>
      <input type = 'text' id = 'textInput' />
      <input type = 'submit' class = 'submitInput' />
    </form>
    <form id = 'loginForm' action = '' style = 'display: none;'>
      <label for = 'usernameInput'>Username</label>
      <input type = 'text' id = 'usernameInput' />
      <label for = 'passwordInput'>Password</label>
      <input type = 'password' id = 'passwordInput' />
      <input type = 'submit' class = 'submitInput' />
    </form>
    <script>
      const socket  = io(),
            login   = document.getElementById('login'),
            room1   = document.getElementById('room1'),
            room2   = document.getElementById('room2'),
            room3   = document.getElementById('room3'),
            curRoom = document.getElementById('currentRoom'),
            area    = document.getElementById('messageSpace'),
            form    = document.getElementById('form'),
            input   = document.getElementById('textInput'),
            formLog = document.getElementById('loginForm'),
            inUser  = document.getElementById('usernameInput'),
            inPass  = document.getElementById('passwordInput'),
            createElement = (type, className, text, parent) => {
              let ele = document.createElement(type);
              if (className)
                ele.className = className;
              if (text)
                ele.innerHTML = text;
              parent.appendChild(ele);
              return ele;
            },
            addMessage = (msg, user, date) => {
              let div = createElement('div', 'message', null, area);
              createElement('p', 'messagePart', msg, div);
              createElement('p', 'messagePart stamp', user + " | " + date, div);
              area.scrollTop = area.scrollHeight;
            },
            removeMessages = () => {
              while (area.childNodes.length)
                area.removeChild(area.lastChild);
            },
            changeRoom = roomNum => {
              removeMessages();
              curRoom.innerText = "Chat Room " + roomNum;
              socket.emit('join room', 'room' + roomNum);
            },
            displayRoom = () => {
              area.style.display = "block";
              curRoom.style.display = "block";
              form.style.display = "block";
              formLog.style.display = "none";
            };
      
      form.addEventListener('submit', e => {
        e.preventDefault();
        if (input.value) {
          socket.emit('chat message', input.value);
          input.value = '';
        }
      });

      formLog.addEventListener('submit', e => {
        e.preventDefault();
        if (inUser.value && inPass.value) {
          socket.emit('login', inUser.value, inPass.value);
          inPass.value = '';
        }
      });
      
      socket.on('chat message', addMessage);

      socket.on("load messages", data => {
        msgs = data.split("\n");
        for (let i = 1; i < msgs.length; ++i)
          addMessage(msgs[i], msgs[++i], msgs[++i]);
      });

      socket.on("login success", displayRoom);

      socket.on("login failure", () => console.log("Login Failure"));
      
      room1.onclick = () => {
        displayRoom();
        changeRoom('1');
      },
      room2.onclick = () => {
        displayRoom();
        changeRoom('2');
      },
      room3.onclick = () => {
        displayRoom();
        changeRoom('3');
      },
      login.onclick = () => {
        area.style.display = "none";
        curRoom.style.display = "none";
        form.style.display = "none";
        formLog.style.display = "block";
      };
    </script>
  </body>
</html>
