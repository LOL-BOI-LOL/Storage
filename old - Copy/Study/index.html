<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Study Elements</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>

<body>
  <table>
    <thead>
      <tr>
        <th>Question</th>
        <th>Answer 1</th>
        <th>Answer 2</th>
        <th>Answer 3</th>
        <th>Answer 4</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td id='question'></td>
        <td id='answer1'></td>
        <td id='answer2'></td>
        <td id='answer3'></td>
        <td id='answer4'></td>
      </tr>
    </tbody>
  </table>
  <p id='txt'></p>
  <button id='start'>Start</button>
  <hr/>
  <p id='q'></p>
  <input type='text' id='input' autocomplete='off'/>
  <button id='start2'>Start</button>
  <p id='res'></p>
  <select id='sel'>
    <option value='none'>None</option>
    <option value='sym'>Symbol</option>
    <option value='nam'>Name</option>
  </select>
  <select id='setSel'>
    <option value='all'>All</option>
    <option value='ele'>Elements</option>
    <option value='ions'>All Ions</option>
    <option value='mono'>Monotomic</option>
    <option value='multi'>Multivalent</option>
    <option value='poly'>Polyatomic</option>
    <option value='latin1'>Latin Vocab 1</option>
    <option value='latin2'>Latin Vocab 2</option>
    <option value='latin3'>Latin Vocab 3</option>
    <option value='upele'>Updated Elements</option>
  </select>
  <script src="script.js"></script>
  <script src="https://replit.com/public/js/replit-badge.js" theme="blue" defer></script> 
</body>

</html>
