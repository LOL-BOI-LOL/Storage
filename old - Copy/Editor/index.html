<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Editor</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body>
    <div id='designarea'>
    </div>
    <div id='editbar'>
      <input type='text' value='' id='label' />
      <div>
        <p class='label'>X Value: </p>
        <input id='x' type='text' value='' />
      </div>
      <div>
        <p class='label'>Y Value: </p>
        <input id='y' type='text' value='' />
      </div>
      <div>
        <p class='label'>Z Value: </p>
        <input id='z' type='text' value='' />
      </div>
      <div>
        <p class='label'>Width: </p>
        <input id='w' type='text' value='' />
      </div>
      <div>
        <p class='label'>Height: </p>
        <input id='h' type='text' value='' />
      </div>
      <div>
        <p class='label'>Color: </p>
        <input id='c' type='color' value='' />
      </div>
      <div>
        <p class='label'>Rotation: </p>
        <input id='r' type='text' value='' />
      </div>
      <p id='submit'>Submit Changes</p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
