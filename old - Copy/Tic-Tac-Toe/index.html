<html>
  <head>
    <title>Tic Tac Toe</title>
    <style>
      * {
        margin: 0px;
      }
      
      body {
        display: flex;
        width: 100vw;
        height: 100vh;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: black;
      }

      button {
        display: block;
        width: 50%;
        height: 100px;
        border: 0px solid black;
        background-color: black;
        color: white;
        font-family: monospace;
        font-size: 3em;
      }

      #board {
        display: none;
        width: 300px;
        height: 300px;
      }

      #leaveBtn {
        display: none;
      }
    </style>
  </head>
  <body>
    <button id = "joinBtn">Join Game</button>
    <canvas id = "board"></canvas>
    <button id = "leaveBtn">Lobby</button>
    <script src = "/socket.io/socket.io.js"></script>
    <script>
      const socket    = io(),
            joinBtn   = document.getElementById("joinBtn"),
            leaveBtn  = document.getElementById("leaveBtn"),
            board     = document.getElementById("board"),
            ctx       = board.getContext("2d"),
            line      = (coord1, coord2) => {
              ctx.beginPath();
              ctx.moveTo(...coord1);
              ctx.lineTo(...coord2);
              ctx.closePath();
              ctx.stroke();
            },
            circle    = (x, y, r) => {
              ctx.beginPath();
              ctx.arc(x, y, r, 0, 2 * Math.PI);
              ctx.stroke();
            },
            drawX     = (x, y) => {
              ctx.strokeStyle = "white";
              ctx.lineWidth = 5;
              line([20 + 100 * x, 20 + 100 * y], [80 + 100 * x, 80 + 100 * y]);
              line([80 + 100 * x, 20 + 100 * y], [20 + 100 * x, 80 + 100 * y]);
            },
            drawO     = (x, y) => {
              ctx.strokeStyle = "white";
              ctx.lineWidth = 5;
              circle(50 + 100 * x, 50 + 100 * y, 30);
            },
            drawBoard = () => {
              ctx.strokeStyle = "white";
              ctx.lineWidth = 5;
              [1, 2].forEach(x => {
                line([100 * x, 10], [100 * x, 290]);
                line([10, 100 * x], [290, 100 * x]);
              });
            };
      
      joinBtn.onclick = () => {
        socket.emit("join room");
      };

      leaveBtn.onclick = () => {
        socket.emit("leave room");
        ctx.clearRect(0, 0, board.width, board.height);
        joinBtn.style.display = "block";
        board.style.display = "none";
        leaveBtn.style.display = "none";
      };

      board.onclick = event => {
        let coords = [event.offsetX, event.offsetY];
            final  = [];
        
        if (coords[0] > 10 && coords[0] < 90)
          final[0] = 0;
        else if (coords[0] > 110 && coords[0] < 190)
          final[0] = 1;
        else if (coords[0] > 210 && coords[0] < 290)
          final[0] = 2;
        else
          return;
        
        if (coords[1] > 10 && coords[1] < 90)
          final[1] = 0;
        else if (coords[1] > 110 && coords[1] < 190)
          final[1] = 1;
        else if (coords[1] > 210 && coords[1] < 290)
          final[1] = 2;
        else
          return;
        
        socket.emit("play", ...final);
      };

      socket.on("join fail", () => {
        console.log("Join Failure");
      });

      socket.on("join success", () => {
        board.style.display = "block";
        joinBtn.style.display = "none";      
        board.width  = 300;
        board.height = 300;
        drawBoard();
      });

      socket.on("update", (x, y, player) => {
        console.log("Received Update");
        if (player == 1)
          drawO(x, y);
        else
          drawX(x, y);
      });

      socket.on("win", (x1, y1, x2, y2, type) => {
        ctx.strokeStyle = "rgb(100, 100, 100)";
        ctx.lineWidth = 8;
        line([x1 * 100 + [50, 10, 10, 10][type], y1 * 100 + [10, 50, 10, 90][type]], [x2 * 100 + [50, 90, 90, 90][type], y2 * 100 + [90, 50, 90, 10][type]]);
        leaveBtn.style.display = "block";
      });

      socket.on("tie", () => {
        leaveBtn.style.display = "block";
      });
    </script>
  </body>
</html>
