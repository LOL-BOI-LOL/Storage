<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Clicker Game</title>
    <link href="style.css" rel="stylesheet" type="text/css" />
  </head>
  <body onload='getClicks()' onbeforeunload='setClicks()'>
    <div id='container'>
      <p id='square'>0</p>
    </div>
    <div id='container2'>
      <p id='shop'>Shop</p>
    </div>
    <div id='container3'>
      <p id='back'>Back</p>
    </div>
    <div id='container4'>
      <svg height="30" width="30" id='arrowl'>
        <polygon points="0,0 30,15 0,30" style="fill:black;stroke:black;stroke-width:1" />
      </svg>
    </div>
    <div id='container5'>
      <svg height="30" width="30" id='arrowr'>
        <polygon points="30,0 0,15 30,30" style="fill:black;stroke:black;stroke-width:1" />
      </svg>
    </div>
    <div id='container10'>
      <p id='colortype'>Square</p>
    </div>
    <div id='container6'>
      <input id='colorinput' type='color' value='#ffffff' />
    </div>
    <div id='container7'>
      <p id='colorbuy'>100 Clicks</p>
    </div>
    <div id='container8'>
      <p id='upgradetype'>Increment Upgrade</p>
    </div>
    <div id='container9'>
      <p id='upgradebuy'> Clicks</p>
    </div>
    <p id='popup'>Generic Message</p>
    <p id='close'>x</p>
    <script src="script.js"></script>
  </body>
</html>
